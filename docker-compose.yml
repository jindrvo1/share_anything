version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: pomoc_ted
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: pomoc_ted
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # ⚠️  Set JWT_SECRET env variable before deploying: export JWT_SECRET=your-secure-secret
      SMTP_HOST: localhost
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASS: ""
      MAIL_FROM: noreply@pomoc-ted.cz
      APP_URL: http://localhost:3000
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend

volumes:
  postgres_data:
